# Dependabot du MIROIR public vigie-civique/vigie-commune.
#
# Ce dépôt est généré depuis le moteur privé : `moteur_construire_public.sh`
# pose ce fichier à la place de `.github/dependabot.yml` à chaque export. Une PR
# fusionnée ici serait effacée par la synchro suivante, qui s'arrête d'ailleurs
# sur tout commit externe. Les montées de version se font donc dans le moteur,
# dont le dependabot.yml les ouvre ; ici, `open-pull-requests-limit: 0` les coupe
# toutes.
#
# Les alertes et mises à jour de SÉCURITÉ ne dépendent pas de ce fichier : c'est
# un réglage du dépôt, et elles continuent d'arriver. Une PR de sécurité ouverte
# ici se reporte dans le moteur, puis la synchro la publie.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /public
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
