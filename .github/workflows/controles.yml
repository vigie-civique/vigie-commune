name: contrôles

# Ce que cette CI vérifie, et pourquoi elle est courte : les trois fonctions qui
# décident ce qui sort du dispositif — le filtre de publication, le classement
# de périmètre, et la liste des fichiers distribués. Chacune a laissé passer un
# défaut réel en août 2026, aucune n'était couverte.
#
# Elle ne collecte rien : pas de réseau, pas de clé, pas d'Ollama. Les tests
# tournent sur une instance factice et une base construite depuis db/schema.sql.

on:
  # push limité à main : une branche est contrôlée par sa PR, pas deux fois
  # (minutes Actions comptées tant que le dépôt est privé).
  push:
    branches: [main]
  # `ready_for_review` en plus des trois types par défaut : une PR ouverte en
  # brouillon ne joue rien (cf. `tests-deps`), et passer « prête » la contrôle.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # Cadence plancher des jobs lourds sur le moteur : allégée le 20/10, la CI ne
  # les jouait plus qu'à la main, et personne ne l'a fait — 30 commits déployés
  # sans eux du 19 au 21/10/2026. Lundi 04:17 UTC, ~20 min par semaine.
  schedule:
    - cron: "17 4 * * 1"

# Un seul dépôt paie ses minutes : `vigie-civique/moteur`, privé (3 000 min par
# mois, épuisées le 20/10/2026 à 19 min facturées par passage). Le même fichier
# part tel quel dans le miroir public `vigie-commune`, où tout est gratuit — et
# chaque synchro y passe par une PR. D'où deux régimes, décidés par le dépôt :
#   - sur le moteur, une PR comme un push sur main ne jouent que `tests-deps`
#     (la suite entière, précédée de deux étapes de garde : la construction
#     de l'archive du kit et la collecte des essais sans dépendances, pour ne
#     pas attendre le lundi) et `generique` ; le reste se lance à la main
#     (workflow_dispatch) et chaque lundi (schedule), où `kit` et `tests`
#     jouent en entier. Le push sur main DOIT
#     jouer quelque chose : `vigie_atelier_deployer.sh` exige « completed
#     success » sur la révision qu'il déploie, et un passage tout sauté
#     conclut « skipped » ;
#   - partout ailleurs (miroir, fork, clone), tout tourne, comme avant.
# Le test est `!= moteur`, pas `== vigie-commune` : un fork joue tout.
#
# Deux économies de plus sur le moteur (01/11/2026 : ~2 500 min par mois, dont
# 40 % rejouaient au push sur main ce que la PR venait de valider) :
#   - une PR en BROUILLON ne joue ni `tests-deps` ni `generique`. On empile les
#     commits en brouillon, on la passe « prête » une fois : un seul passage ;
#   - au push sur main, `deja-vu` cherche la PR fusionnée et ne fait sauter les
#     deux jobs que si son passage vert a éprouvé EXACTEMENT l'arbre poussé
#     (conditions dans le job). Le passage conclut alors « success » par
#     `deja-vu` seul, et la porte des déployeurs reste la même. Au moindre
#     doute (rebase, branche en retard sur main, API muette), tout rejoue.
concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    if: github.repository != 'vigie-civique/moteur' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # La borne basse est celle qu'on annonce dans pyproject ; la haute est
        # proche de la machine de développement. Entre les deux, c'est vérifié.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Dépendances de test
        # Pas requirements.txt : la suite ne doit dépendre ni des collecteurs ni
        # de l'API. Si un test se met à réclamer requests, c'est qu'il sort sur
        # le réseau, et il ne devrait pas. Les tests qui s'adressent à l'API font
        # exception et sont sautés ici — cf. le job `tests-deps`, qui les joue.
        run: pip install pytest
      - name: Tests
        run: python -m pytest -ra

  deja-vu:
    # Au push sur main du moteur seulement. Sort `vert=true` si, et seulement si :
    #   1. le commit poussé M est le `merge_commit_sha` d'une PR fusionnée de ce
    #      dépôt (pas d'un fork), de tête H ;
    #   2. M^1 (main avant la fusion) est un ancêtre de H : la branche était à
    #      jour. Comme main n'avance qu'en avance rapide (ruleset), la base B
    #      contre laquelle la PR a été éprouvée est elle aussi un ancêtre de H,
    #      donc l'arbre éprouvé (fusion de H dans B) est celui de H ;
    #   3. l'arbre de M est celui de H : la fusion n'a rien ajouté ;
    #   4. un passage `pull_request` de ce workflow sur H a `tests-deps` ET
    #      `generique` en « success » (pas « skipped » : un brouillon ne compte pas).
    # Une fusion par rebase de plusieurs commits échoue à 2 : tout rejoue (un
    # rebase d'un seul commit passe, à raison : même arbre). Une PR dont la base
    # a changé en cours de route est écartée : son passage vert a pu éprouver
    # une autre base. Toute erreur rend false ; et si le job lui-même tombe
    # (checkout, runner), `continue-on-error` laisse une sortie vide : les deux
    # jobs rejouent et le passage conclut sur eux, pas sur cette panne.
    if: github.repository == 'vigie-civique/moteur' && github.event_name == 'push'
    continue-on-error: true
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      vert: ${{ steps.verdict.outputs.vert }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # L'historique des commits sans leurs arbres : assez pour `merge-base`
          # et `^{tree}`, presque rien à télécharger.
          fetch-depth: 0
          filter: tree:0
      - id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          M: ${{ github.sha }}
        run: |
          vert=false
          trap 'echo "vert=$vert" >> "$GITHUB_OUTPUT"; echo "deja-vu : vert=$vert"' EXIT
          non() { echo "→ on rejoue : $1"; exit 0; }

          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$M/pulls" \
                 --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$M\"
                        and .head.repo.full_name == \"$GITHUB_REPOSITORY\")][0]
                       | select(. != null) | \"\(.number) \(.head.sha)\"") \
            || non "API des PR muette"
          [ -n "$pr" ] || non "$M n'est la fusion d'aucune PR de ce dépôt"
          read -r num H <<< "$pr"
          echo "PR #$num, tête $H"

          git fetch -q --filter=tree:0 origin "+refs/pull/$num/head:refs/remotes/pr/$num" \
            || non "tête de la PR introuvable"
          git merge-base --is-ancestor "$M^1" "$H" || non "la branche était en retard sur main"
          tm=$(git rev-parse --verify "$M^{tree}") && th=$(git rev-parse --verify "$H^{tree}") \
            || non "arbre illisible"
          [ "$tm" = "$th" ] || non "l'arbre poussé n'est pas celui de la PR"

          # En deux temps : sans pipefail, `gh | awk` rendrait le statut d'awk,
          # et une API muette passerait pour « aucun changement de base ».
          ev=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$num/events" \
                 --jq '.[] | select(.event == "base_ref_changed") | .id') \
            || non "événements de la PR muets"
          [ -z "$ev" ] || non "la base de la PR a changé en cours de route"

          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/controles.yml/runs?event=pull_request&head_sha=$H&status=success" \
                         --jq '.workflow_runs[].id'); do
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
                   --jq '[.jobs[] | select((.name == "tests-deps" or .name == "generique") and .conclusion == "success")] | length') \
              || continue
            if [ "$ok" = 2 ]; then
              echo "passage $run : tests-deps et generique verts sur cet arbre"
              vert=true
              exit 0
            fi
          done
          non "aucun passage de PR vert (tests-deps + generique) sur $H"

  tests-deps:
    # Le job précédent saute ce qui exige l'API ou les collecteurs. Celui-ci
    # installe tout et rejoue la suite ENTIÈRE : sans lui, un fichier sauté
    # partout serait un contrôle mort, et c'est justement là que vit le verrou
    # d'origine — l'interface grise ce qu'elle interdit, mais elle ne protège
    # que celui qui l'utilise. Rien ne sort sur le réseau pour autant : le
    # client de test de FastAPI appelle l'application dans le même processus.
    #
    # `!cancelled()` : sans lui, `deja-vu` sauté (tout sauf un push du moteur)
    # ferait sauter ce job. Sauté aussi sur une PR en brouillon.
    needs: deja-vu
    if: ${{ !cancelled() && needs.deja-vu.outputs.vert != 'true' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: L'archive du kit se construit
        # Ce que `kit` joue le lundi, joué aussi sur chaque PR prête : sans cela,
        # un défaut entré par une PR n'apparaît que le lundi suivant. Placée
        # AVANT « Dépendances » : `build_kit.py` n'en demande aucune (le job
        # `kit` n'en installe pas) et doit voir un dépôt propre, avant que la
        # suite n'y écrive quoi que ce soit.
        env:
          VIGIE_INSTANCE: tests/instance_test.json
        run: python scripts/build_kit.py
      - name: Les essais se collectent sans dépendances
        # Ce que `tests` joue le lundi, réduit à la collecte : un import de
        # numpy, de pdfplumber ou d'un collecteur en tête d'un essai casse un
        # poste qui n'a que pytest, et la collecte suffit à le voir, sans
        # exécuter la suite. Placée AVANT « Dépendances » : elle n'a de sens
        # que sans les paquets. Dans un venv à part : un `pip install pytest`
        # dans l'environnement du job tirerait `packaging` sans empreinte, et
        # le `--require-hashes` suivant répondrait « déjà installé » sans rien
        # contrôler (avis vigie-securite).
        run: |
          python -m venv "$RUNNER_TEMP/collecte"
          "$RUNNER_TEMP/collecte/bin/pip" install pytest
          "$RUNNER_TEMP/collecte/bin/python" -m pytest --collect-only -q
      - name: Dépendances
        # Deux appels : le mode empreintes s'étend à tout ce qu'un appel
        # installe, et pytest n'a pas d'empreinte dans requirements.txt.
        run: |
          pip install --require-hashes -r requirements.txt
          pip install pytest
      - name: Suite entière
        # Un test SAUTÉ ici est un défaut, pas une information : tout est
        # installé, donc un skip dénonce un paquet absent de requirements.txt.
        # Deux collecteurs ont vécu des mois dans cet angle mort.
        # Seule exception : les essais des gardes de .claude/, qui ne part pas
        # dans le miroir public ; leur saut dit « (miroir public) ».
        run: |
          python -m pytest -ra | tee resultat.txt
          statut=${PIPESTATUS[0]}
          if [ "$statut" -ne 0 ]; then exit "$statut"; fi
          if grep '^SKIPPED' resultat.txt | grep -qv '(miroir public)$'; then
            echo "::error::un test sauté alors que les dépendances sont installées"
            exit 1
          fi

  windows:
    # L'installateur vise Windows, et rien ne le vérifiait : `import fcntl` dans
    # scripts/publication.py empêchait l'API de se charger, donc l'atelier de
    # démarrer. Ce job installe ce que l'installateur installe et charge ce que
    # le lanceur charge. Sur 3.12 ET 3.13 : `amorcage.ps1` cherche 3.13 d'abord.
    # `--only-binary` : un poste Windows n'a pas de compilateur. Une dépendance
    # sans roue pour l'une de ces versions (numpy 1.26 n'en avait pas en 3.13)
    # doit échouer ici, pas chez la personne qui installe.
    if: github.repository != 'vigie-civique/moteur' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Dépendances
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements.txt
          pip install pytest
      - name: L'API et les collecteurs se chargent
        env:
          VIGIE_INSTANCE: tests/instance_test.json
          VIGIE_RULES: config/publication_rules.exemple.json
          JWT_SECRET: secret-de-ci-sans-valeur-32-octets-au-moins
          PYTHONUTF8: "1"
        run: python -c "import api, collectors.run_all"
      - name: Le verrou de fichier
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -ra tests/test_verrou.py

  generique:
    # Séparé des tests : ce contrôle est l'admission du kit. Le voir échouer
    # seul dit immédiatement qu'une particularité locale est entrée dans le
    # moteur, sans avoir à lire un rapport de suite. Mêmes sauts que `tests-deps`.
    needs: deja-vu
    if: ${{ !cancelled() && needs.deja-vu.outputs.vert != 'true' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Le moteur ne nomme aucune commune
        env:
          VIGIE_INSTANCE: tests/instance_test.json
        run: python scripts/verifier_generique.py
      - name: Aucun nom indéfini dans le code Python
        # Un nom indéfini ne casse qu'à l'exécution, et seulement sur la branche
        # qui le porte : `len(COMMUNES)` dans le message d'échec d'osm, `_MOIS`
        # dans les dates de PV de cm_parser (retiré le 13/08). Trouvés le
        # 26/10/2026 sur le VPS, pas par la suite. Seulement F821-F823 : les
        # autres règles de pyproject ont un passif à solder d'abord.
        run: |
          pip install ruff==0.17.2
          ruff check --select F821,F822,F823 --output-format github .

  kit:
    # Fabrique l'archive distribuable sur un dépôt sans instance ni base : c'est
    # l'état d'un clone public. Une archive qui ne se construit pas là ne se
    # construira pas chez celui qui la reprend.
    if: github.repository != 'vigie-civique/moteur' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: L'archive se construit et ne contient rien d'interdit
        env:
          VIGIE_INSTANCE: tests/instance_test.json
        run: python scripts/build_kit.py

  site:
    # La chaîne complète sur une commune qui n'existe pas : base vierge au
    # schéma réel, snapshot, contrôle d'étanchéité, build. Elle ne publie rien,
    # elle vérifie que rien ne casse entre la base et le HTML — c'est le
    # parcours qu'un dépôt fraîchement cloné doit pouvoir suivre.
    if: github.repository != 'vigie-civique/moteur' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          # La version vient du champ `packageManager` du paquet.
          package_json_file: public/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # 22 et non 20 : le contrôle du dossier hors-ligne pilote Chrome par
          # CDP, et `WebSocket` n'est global qu'à partir de Node 22.
          node-version: "22"
          cache: pnpm
          cache-dependency-path: public/pnpm-lock.yaml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Base d'épreuve
        # Depuis le 03/10/2026 : des actes d'assemblée avec leur texte, un
        # dossier d'épreuve retenu (tests/fixtures/dossiers/) qui les cite, et
        # les règles d'exemple complétées des domaines de l'instance factice
        # (db/ci.regles.json) — comme `init_instance` le fait pour une vraie.
        # Sans elles, aucun acte ne sortait et le texte des actes, les liens
        # et les retours n'étaient éprouvés nulle part.
        env:
          VIGIE_DB: db/ci.db
          VIGIE_CI_DOSSIERS: "1"
        run: python tests/amorcer_base_ci.py
      - name: Publication en deux temps — l'aperçu ne publie rien
        # Le flux tel qu'un admin le vit depuis l'atelier, sur le vrai
        # générateur et le vrai contrôleur. La suite pytest éprouve
        # l'orchestration sur des répertoires jetables ; ici on vérifie que
        # l'assemblage tient sur une vraie base — et surtout que générer un
        # aperçu ne touche pas au répertoire publié.
        env:
          VIGIE_INSTANCE: tests/instance_test.json
          VIGIE_RULES: db/ci.regles.json
          VIGIE_DB: db/ci.db
        run: |
          python - <<'PY'
          import sys
          from scripts import publication as pub

          apercu = pub.generer_apercu(auteur="ci")
          assert apercu["controle"]["ok"], apercu["controle"]["rapport"]
          assert not (pub.PUBLIE / "stats.json").exists(), \
              "générer un aperçu a écrit dans le répertoire publié"
          assert pub.etat_publication()["etape"] == "pret_a_publier"

          try:
              pub.publier(auteur="ci", role="validator")
              sys.exit("un non-admin a pu publier")
          except pub.PublicationRefusee:
              pass

          publie = pub.publier(auteur="ci", role="admin")

          # « promu_localement », et non « publié » : entre les répertoires
          # servis et le site en ligne il y a un build et un déploiement que
          # l'atelier ne fait pas. Le dernier état se CONSTATE, il ne se déduit
          # pas — et la CI n'a pas de site à interroger.
          etat = pub.etat_publication()
          assert etat["etape"] == "promu_localement", etat["etape"]
          assert etat["etape_libelle"]

          # La mise en service est atomique : chaque emplacement est construit à
          # côté, contrôlé, puis renommé. Ce qui est servi porte donc toujours
          # une version entière, et déclare laquelle.
          assert publie["empreinte"] == pub.empreinte(pub.PUBLIE), \
              "le répertoire servi ne porte pas la version annoncée"
          assert (pub.PUBLIE / "version.json").is_file(), \
              "le répertoire servi ne déclare pas ce qu'il sert"

          # Et l'on peut revenir en arrière — un contrôle vert dit qu'une
          # version est étanche, pas qu'elle est bonne. Il faut deux
          # publications pour cela : à la première, il n'y a pas d'avant.
          try:
              pub.revenir_a_la_version_precedente(pub.PUBLIE)
              sys.exit("il n'y avait pourtant aucune version précédente")
          except pub.PublicationRefusee:
              pass

          pub.publier(auteur="ci", role="admin")
          repris = pub.revenir_a_la_version_precedente(pub.PUBLIE)
          assert (pub.PUBLIE / "stats.json").is_file(), \
              "le retour arrière a laissé le répertoire servi vide"
          assert repris["empreinte"] == publie["empreinte"], \
              "la version remise en service n'est pas celle d'avant"
          print("aperçu → contrôle → promotion → retour arrière : le flux tient.")
          PY

      - name: Snapshot et contrôle d'étanchéité
        env:
          VIGIE_INSTANCE: tests/instance_test.json
          VIGIE_RULES: db/ci.regles.json
          VIGIE_DB: db/ci.db
        run: |
          python scripts/build_public_snapshot.py
          python scripts/verify_snapshot.py public/static/data
          # Le graphe des liens, de bout en bout : des actes avec leur texte,
          # un dossier dont les citations sont reliées, des retours, et le
          # bandeau d'un acte cité qui a changé depuis la relecture.
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path("public/static/data")
          s = json.loads((d / "stats.json").read_text())
          assert s["extraits_actes"] >= 6, f"textes d'actes : {s['extraits_actes']}"
          [dossier] = json.loads((d / "dossiers.json").read_text())["dossiers"]
          assert "/deliberations/2021#c-2021-41" in dossier["texte"], "citation non reliée"
          assert dossier.get("perime", {}).get("elements"), "la péremption ne se voit pas"
          liens = json.loads((d / "liens.json").read_text())
          assert liens["actes"].get("c-2021-41"), "aucun retour vers l'acte cité"
          assert json.loads((d / "lacunes.json").read_text())["total"] >= 2
          print("graphe des liens :", s["graphe"])
          # Un marché lu dans un procès-verbal et déposé à l'atelier : il est
          # COMPTÉ en attente, et il n'est PAS publié (extraction ≠ publication).
          x = json.loads((d / "couverture.json").read_text())["extraits"]["marches"]
          assert x["en_attente"]["commune"] == 1, x
          assert json.loads((d / "marches.json").read_text())["marches"] == [], \
              "une ligne extraite est publiée sans avoir été relue"
          PY
      - name: Build
        working-directory: public
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          # Les ancres datées et les retours sont dans le HTML prérendu.
          grep -q 'id="c-2021-41"' build/deliberations/2021.html
          grep -q 'Cité dans' build/deliberations/2021.html
          grep -q 'Un élément cité a changé' build/dossiers/eau.html
          # Charte IA : la page Méthode dit où l'IA intervient ; les textes ne
          # le répètent pas un à un (charte v0.4).
          grep -q 'id="ia"' build/methode.html
          # Chaque séance a sa page, relue ou non ; la séance relue mène à sa
          # feuille, et l'accueil mène à la page de séance (lot 6).
          grep -q 'Mise en clair' build/conseils/2021-04-14_conseil-municipal.html
          grep -q 'Pas encore mise en clair' build/conseils/2025-04-02_conseil-communautaire.html
          grep -q 'href="/conseils/2021-04-14_conseil-municipal"' build/deliberations/2021.html
          # Un zéro de marchés dit pourquoi : ici, une attribution lue dans un
          # procès-verbal attend sa relecture (lot 4 b), et le nombre est donné.
          grep -q 'attend sa' build/marches.html
          grep -q 'attend sa' build/index.html
          # Chaque résultat de recherche mène à une page qui l'affiche : avant
          # le 04/10/2026, ≈ 1 400 résultats de Lasalle visaient une ancre
          # absente de /deliberations/<année>, ou une année sans page.
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          b = Path("build")
          index = json.loads((b / "data" / "recherche_index.json").read_text())["index"]
          fautes = []
          for e in index:
              u = e.get("u")
              if not u or u.startswith("http"):
                  continue
              chemin, _, ancre = u.partition("#")
              page = next((p for p in (b / (chemin.strip("/") + ".html"),
                                       b / chemin.strip("/"), b / chemin.strip("/") / "index.html")
                           if p.is_file()), None)
              if page is None:
                  fautes.append(f"{u} : aucune page")
              elif ancre and f'id="{ancre}"' not in page.read_text(errors="replace"):
                  fautes.append(f"{u} : ancre absente")
          assert not fautes, "\n".join(fautes)
          print(f"recherche : {len(index)} entrées, toutes mènent à ce qu'elles annoncent")
          PY

      - name: Le dossier hors-ligne s'ouvre comme un lecteur l'ouvre
        # Le contrôle qui manquait. Les deux défauts qu'il cherche — des liens
        # internes qui tombent sur une liste de fichiers, un sélecteur
        # d'exercice inerte — ne naissent que dans le navigateur du lecteur :
        # ils ont traversé quatre dossiers livrés entre le 03 et le 11/09/2026
        # pendant que tous les contrôles de texte restaient verts.
        #
        # Le build est REFAIT avec VIGIE_HORS_LIGNE=1 : c'est l'artefact remis
        # qu'on éprouve, pas le site en ligne, et ils ne s'écrivent pas pareil.
        # Chrome est préinstallé sur ubuntu-24.04.
        #
        # Depuis le 01/11/2026, le double-clic est éprouvé ICI aussi : chaque
        # page doit s'hydrater en `file://`, le sélecteur répondre, la recherche
        # et la carte recevoir leurs fichiers (scripts/pour_le_double_clic.mjs).
        # Seuls les LIENS en `file://` attendent la mise en forme d'archive
        # (chemins relatifs, LISEZ-MOI), qui vit dans le dépôt du portail : le
        # contrôle le dit, et le portail les éprouve après `prepare_offline_export`.
        working-directory: public
        env:
          VIGIE_HORS_LIGNE: "1"
          VIGIE_BUILD_DIR: build-hors-ligne
        run: |
          pnpm exec vite build
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" \
            node scripts/verifier_hors_ligne.mjs build-hors-ligne

  atelier:
    # L'atelier n'était construit par aucun job : seul l'audit des dépendances le voyait.
    # Une faute de syntaxe dans un composant, ou une couleur écrite en dur (le
    # build commence par `verifier_couleurs.mjs`, qui sort en 1), n'apparaissait
    # qu'au déploiement sur le serveur — là où le script revient en arrière.
    if: github.repository != 'vigie-civique/moteur' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          # La version vient du champ `packageManager` du paquet.
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Libellés de l'instance factice
        # `src/lib/instance.js` n'est pas versionné : il se dérive de
        # l'instance, comme à l'installation (deploy/README.md, étape d).
        env:
          VIGIE_INSTANCE: tests/instance_test.json
        run: python scripts/generer_libelles.py
      - name: Build
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          test -s dist/index.html

  nginx:
    # Le modèle de configuration du site public (cibles `rsync` et `local`) :
    # nginx le charge-t-il ? Un modèle qu'on recopie sur un serveur sans l'avoir
    # jamais donné à nginx casse le jour de l'installation. La version est celle
    # de Debian 12, où `listen … http2` n'est pas encore déprécié.
    if: github.repository != 'vigie-civique/moteur' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: nginx -t
        run: |
          mkdir -p /tmp/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=commune.example.org" \
            -keyout /tmp/tls/privkey.pem -out /tmp/tls/fullchain.pem 2>/dev/null
          chmod 644 /tmp/tls/*.pem
          docker run --rm \
            -v "$PWD/deploy/nginx-site.conf:/etc/nginx/conf.d/site.conf:ro" \
            -v "$PWD/deploy/nginx-site-entetes.conf:/etc/nginx/snippets/vigie-site-entetes.conf:ro" \
            -v /tmp/tls:/etc/letsencrypt/live/commune.example.org:ro \
            nginx:1.22-alpine nginx -t
          # Chaque règle de `_redirects` a son `location` dans le modèle.
          grep -vE '^\s*(#|$)' public/static/_redirects | while read -r de vers code; do
            grep -qF "location = $de " deploy/nginx-site.conf \
              || { echo "✖ $de (→ $vers) n'est pas traduite dans deploy/nginx-site.conf"; exit 1; }
          done

  dependances:
    # Les vulnérabilités CONNUES de ce que le dispositif installe. Depuis que
    # l'atelier se met en ligne (lot E, 02/10/2026), la couche HTTP est exposée :
    # le premier audit a trouvé cinq avis sur Starlette, corrigés en relevant
    # les versions épinglées. Ce job les empêche de revenir sans qu'on le voie.
    #
    # Les paquets de PRODUCTION seulement côté JavaScript : les deux sites sont
    # statiques, les outils de build ne sont pas servis.
    if: github.repository != 'vigie-civique/moteur' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          # La version vient du champ `packageManager` du paquet.
          package_json_file: public/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Python
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --require-hashes --no-deps --progress-spinner off
      - name: Atelier
        working-directory: dashboard
        run: pnpm audit --prod
      - name: Site public
        working-directory: public
        run: pnpm audit --prod
