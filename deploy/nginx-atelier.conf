# nginx — atelier : SPA statique + proxy vers l'API locale.
#
# L'atelier est FACULTATIF, et ce qu'il sert n'est PAS filtré : la base de
# travail contient des pistes non vérifiées, des personnes sans rôle public et
# des liens de famille, tout ce que le site public écarte. Le mettre en ligne
# demande donc du TLS, une authentification, et l'idée claire qu'une fuite ici
# n'a pas les mêmes conséquences qu'une fuite sur le site public.
#
# DEUX VERROUS, et ils ne se marchent pas dessus :
#   1. le mur HTTP de nginx (`auth_basic`), commun à l'équipe — il occupe
#      l'en-tête `Authorization` ;
#   2. les comptes nommés de l'atelier — leur jeton voyage dans
#      `X-Atelier-Session` (cf. api_auth.py), précisément pour laisser
#      `Authorization` au mur.
# Le mur ne remplace pas les comptes : il retire l'atelier de la vue de qui
# balaie l'internet, et donne à fail2ban quelque chose à compter.
#
# Le mur : UNE LIGNE PAR PERSONNE, jamais un identifiant commun. Avec un seul
# identifiant, retirer quelqu'un obligeait à changer le mot de passe de tous ;
# avec une ligne chacun, on retire la sienne et personne d'autre ne bouge
# (audit du 15/11/2026, B3). Le fichier est relu à chaque requête : ni
# rechargement de nginx ni redémarrage.
#   ajouter    : sudo htpasswd /etc/nginx/.htpasswd-vigie-atelier <prenom.nom>
#   retirer    : sudo htpasswd -D /etc/nginx/.htpasswd-vigie-atelier <prenom.nom>
#   qui y est  : sudo cut -d: -f1 /etc/nginx/.htpasswd-vigie-atelier
# Retirer la ligne ne suffit pas : désactiver AUSSI le compte de l'atelier
# (page Comptes). C'est lui qui ferme l'atelier et l'aperçu, à la requête
# suivante ; la ligne du mur n'est que la première porte.
#
# Installer :
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-vigie-atelier <première personne>
#   (`-c` CRÉE le fichier, et l'écrase s'il existe : la première fois seulement)
#   sudo certbot certonly --webroot -w /var/www/certbot -d atelier.example.org
#   sudo install -d -m 0755 /var/www/vigie-atelier
#   sudo install -m 0644 deploy/atelier-401.html /var/www/vigie-atelier/401.html
#   sudo cp deploy/nginx-atelier.conf /etc/nginx/sites-available/vigie-atelier
#   sudo ln -s /etc/nginx/sites-available/vigie-atelier /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# À adapter : server_name (4 fois, et 4 pour chacun des hôtes des documents et
# de l'aperçu plus bas, plus l'adresse de l'atelier dans `@vers_atelier`), les
# chemins des certificats, root (build de l'atelier : cd dashboard && pnpm run
# build → dist/), le nom du mur (auth_basic) et le texte de la page 401.

# Bornes de débit, par adresse. La connexion est la seule route de l'API qui
# réponde sans session : c'est elle qu'on essaie de forcer.
limit_req_zone $binary_remote_addr zone=atelier_connexion:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=atelier_api:10m       rate=20r/s;
# L'entrée de l'aperçu : sa propre zone. Sur celle de la connexion, un passage
# qui tourne en rond (témoin refusé par le navigateur) privait toute une salle
# de connexion à l'atelier.
limit_req_zone $binary_remote_addr zone=apercu_entree:10m     rate=20r/m;
# Les pages de l'aperçu : leur zone à elles. Sur celle de l'API, une page et
# ses ressources entamaient la borne de l'atelier et de l'hôte des documents.
limit_req_zone $binary_remote_addr zone=apercu:10m            rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name atelier.example.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://atelier.example.org$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atelier.example.org;

    ssl_certificate     /etc/letsencrypt/live/atelier.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atelier.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/vigie/dashboard/dist;
    index index.html;

    # Le mur, sur TOUT le serveur — API comprise.
    # Son nom (realm) : ASCII seulement, ni guillemet ni barre oblique inverse.
    # nginx le recopie sans échappement dans `WWW-Authenticate`, et un octet
    # accentué s'y affiche au gré du navigateur. Le changer fait retaper le mot
    # de passe une fois : les navigateurs rangent l'identifiant sous ce nom.
    auth_basic           "Atelier de Testonville au clair (contributeurs seulement)";
    auth_basic_user_file /etc/nginx/.htpasswd-vigie-atelier;

    # Ni version de nginx dans `Server:`, ni dans les pages d'erreur.
    server_tokens off;

    # Le refus du mur : une page en français plutôt que celle de nginx. SANS
    # `=` : le code reste 401 et `WWW-Authenticate` part avec — sinon le
    # navigateur ne demanderait plus le mot de passe. Les 401 de l'API passent
    # tels quels (pas de `proxy_intercept_errors`) : l'interface les lit en JSON.
    error_page 401 /__vigie-401.html;

    # ⚠️ `add_header` ne s'hérite du `server` QUE si le `location` n'en déclare
    # aucun : un seul `add_header` dans un bloc fait tomber tous ceux-ci. Aucun
    # `location` ci-dessous n'en déclare — le cache des actifs passe par
    # `expires`, qui n'est pas un `add_header`. Garder cette propriété.
    #
    # La CSP est celle d'une application qui garde une session dans le
    # navigateur : aucun cadre, aucune origine tierce hors les tuiles du fond de
    # carte (à adapter à l'instance).
    #
    # `script-src` n'est PAS ici, et `default-src` non plus (il vaudrait pour les
    # scripts) : le build de l'atelier signe son bloc d'amorçage et pose lui-même
    # `script-src 'self' 'sha256-…'` dans une balise <meta> de la page
    # (dashboard/vite.config.js, option csp). L'empreinte change à chaque build ;
    # la recopier ici la ferait mentir au premier déploiement. Deux politiques
    # s'additionnent : celle-ci tient tout le reste, la balise tient les scripts.
    add_header Content-Security-Policy "style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # L'atelier n'a rien à faire dans un index de moteur de recherche.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 1m;

    # La connexion et l'invitation — là où un mot de passe ou un jeton se
    # devine : bornées serré. Un 429 s'inscrit au journal d'erreurs, que
    # fail2ban lit (filtre nginx-limit-req).
    #
    # ⚠️ Ces deux-là SEULEMENT, pas tout `/api/auth/` : l'interface appelle
    # `/api/auth/me` et `/api/auth/refresh` à chaque page, et une salle de
    # réunion sort par UNE adresse. Huit bénévoles qui ouvrent l'atelier
    # ensemble dépassaient la borne, puis fail2ban bannissait la salle entière.
    location = /api/auth/login {
        limit_req zone=atelier_connexion burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/vigie-atelier-proxy.conf;
    }
    location /api/auth/invitation/ {
        limit_req zone=atelier_connexion burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/vigie-atelier-proxy.conf;
    }

    # Le dépôt de document : la seule route qui reçoive un fichier (50 Mo, la
    # borne de l'API). Partout ailleurs, 1 Mo.
    location = /api/atelier/documents {
        client_max_body_size 50m;
        limit_req zone=atelier_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/vigie-atelier-proxy.conf;
    }

    # API FastAPI locale — le verrou de session est dans l'application (api.py
    # refuse par défaut : toute route /api/ non authentifiée répond 401).
    location /api/ {
        limit_req zone=atelier_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/vigie-atelier-proxy.conf;
    }

    # La page du refus se sert SANS le mur, sinon le refus la refuserait et
    # nginx retomberait sur sa page anglaise. `internal` : seul `error_page` y
    # mène, demandée du dehors elle rend 404. Un fichier, hors du répertoire de
    # l'interface (le déploiement remplace celui-ci par renommage) et hors de
    # /srv/vigie (le compte `vigie` y renomme ce qu'il veut).
    # ⚠️ Aucun `add_header` ici : ceux du `server` (CSP, HSTS, noindex…)
    # s'héritent et partent avec le 401.
    location = /__vigie-401.html {
        internal;
        auth_basic off;
        charset utf-8;
        alias /var/www/vigie-atelier/401.html;
    }

    # Assets versionnés par leur empreinte : immuables.
    location /_app/immutable/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA SvelteKit (adapter-static, fallback index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Les documents archivés : un hôte à part ──────────────────────────────────
#
# Un document collecté ou déposé n'est pas de confiance. Ouvert à l'adresse de
# l'atelier, il s'y exécutait à côté de la session de celui qui le lit. Il
# s'ouvre ici, sur un hôte qui ne porte ni l'interface, ni l'API, ni cookie de
# session, par un lien que l'API signe pour un compte et cinq minutes
# (api_auth.py, « Les documents »).
#
# PAS de mur `auth_basic` : le navigateur redemanderait le mot de passe pour cet
# hôte, et la signature du lien est le verrou. Seul `/d/` passe.
#
# À faire en plus :
#   - DNS : docs.atelier.example.org vers le même serveur ;
#   - sudo certbot certonly --webroot -w /var/www/certbot -d docs.atelier.example.org
#   - .env de l'atelier : DOCS_URL=https://docs.atelier.example.org
#     (sans elle, l'atelier garde l'ancien chemin, en `blob:`).

server {
    listen 80;
    listen [::]:80;
    server_name docs.atelier.example.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://docs.atelier.example.org$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.atelier.example.org;

    ssl_certificate     /etc/letsencrypt/live/docs.atelier.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.atelier.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Les autres en-têtes (nosniff, no-referrer, cadres, CORP, cache) viennent
    # de l'application, réponse par réponse.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Le lien signé est dans l'adresse : ne pas l'écrire au journal d'accès.
    access_log off;

    location /d/ {
        limit_req zone=atelier_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/vigie-atelier-proxy.conf;
    }
    # Le 404 est celui de nginx : l'application n'a pas pu poser ses en-têtes.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        return 404;
    }
}

# ── /etc/nginx/snippets/vigie-atelier-proxy.conf ─────────────────────────────
#
# À poser tel quel dans ce fichier (un `include` ne peut pas se définir ici) :
#
#     proxy_pass http://127.0.0.1:8765;
#     proxy_set_header Host              $host;
#     proxy_set_header X-Real-IP         $remote_addr;
#     proxy_set_header X-Forwarded-For   $remote_addr;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     # Le mot de passe du mur s'arrête à nginx : l'application n'a pas à le voir.
#     proxy_set_header Authorization     "";
#     # La clé d'administration ne sert qu'en boucle locale, jamais depuis internet.
#     proxy_set_header X-Admin-Key       "";
#     proxy_read_timeout 300s;
#
# `X-Forwarded-For $remote_addr`, et non `$proxy_add_x_forwarded_for` : ce
# dernier RECOPIE ce que le client a envoyé, donc lui laisse choisir l'adresse
# que l'application croira voir. nginx est ici le seul proxy.

# ── Aperçu du site public ────────────────────────────────────────────────────
#
# L'atelier lance le site public sur le port 5180, branché sur le snapshot
# brouillon. Sur un poste local, l'exploitant y accède directement. Sur un
# atelier distant, non : le serveur d'aperçu n'écoute que sur la boucle locale,
# et rien ne le proxifiait — le bouton « Ouvrir l'aperçu » y renvoyait vers un
# `localhost` qui, depuis le poste qui consulte, ne désigne pas la machine de
# l'atelier. L'aperçu ne s'ouvrait jamais.
#
# Un SOUS-DOMAINE, et non un préfixe sous l'atelier : les liens du site public
# sont absolus (`href="/deliberations"`). Le servir sous `/apercu/` les
# casserait tous, et l'aperçu ne montrerait plus le site tel qu'il sera publié
# — ce qui est précisément sa seule raison d'être.
#
# Ce que cet hôte sert n'est PAS le site public : c'est un brouillon non publié,
# monté depuis une base de travail. Il se protège comme l'atelier, pas comme un
# site ouvert.
#
# DEUX VERROUS ici aussi :
#   1. le mur `auth_basic`, le même fichier que l'atelier (une ligne par
#      personne, cf. en tête) ;
#   2. une SESSION de l'atelier, jugée par l'API à chaque requête
#      (`auth_request`). Le mur seul laissait l'aperçu à qui connaissait
#      l'identifiant, compte désactivé ou non (audit du 15/11/2026, B3).
#
# Le passage (api_auth.py, « L'aperçu du site, derrière les comptes ») :
#   aperçu sans témoin → 403 → renvoi vers l'ATELIER, `/api/auth/apercu/ouvrir`
#   → la session de l'atelier y est reconnue (cookie de rafraîchissement)
#   → code à usage unique, une minute → `/__vigie/entree` ici
#   → témoin propre à cet hôte, un quart d'heure, rejugé à chaque requête.
# Un compte désactivé, ou dont les sessions sont closes, est refusé à la
# requête suivante. L'atelier et cet hôte doivent être du MÊME SITE
# (apercu.X et atelier.X) : le cookie de l'atelier est `SameSite=Strict`.
#
# Le compte jugé part vers le serveur d'aperçu dans `X-Vigie-Compte` ; ce
# serveur ne croit que lui (atelier.service : VIGIE_APERCU_COMPTE_PAR_ENTETE=1).
# Chacun voit SON aperçu, quoi qu'il mette dans l'adresse ou ses cookies.
#
# À faire en plus :
#   - DNS : apercu.example.org vers le même serveur ;
#   - sudo certbot certonly --webroot -w /var/www/certbot -d apercu.example.org
#   - .env de l'atelier : VIGIE_APERCU_URL=https://apercu.example.org (sans quoi
#     l'atelier affiche le lien `localhost`, et le passage refuse de s'ouvrir) ;
#     ATELIER_URL=https://atelier.example.org (le lien « Ouvrir l'atelier » d'un
#     passage périmé).
# À adapter : server_name et certificats (4 fois), l'adresse de l'atelier dans
# `@vers_atelier`, le nom du mur.

server {
    listen 80;
    listen [::]:80;
    server_name apercu.example.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://apercu.example.org$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apercu.example.org;

    ssl_certificate     /etc/letsencrypt/live/apercu.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apercu.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Un brouillon ne s'encadre pas, même depuis une page du même site (l'hôte
    # des documents). ⚠️ Aucun `add_header` dans les `location` ci-dessous :
    # un seul ferait tomber ceux-ci (cf. l'atelier).
    add_header X-Frame-Options "DENY" always;

    # 1. Le mur : même fichier, même nom (realm) que l'atelier.
    auth_basic           "Atelier de Testonville au clair (contributeurs seulement)";
    auth_basic_user_file /etc/nginx/.htpasswd-vigie-atelier;

    # 2. La session de l'atelier, sur TOUT le serveur. L'API répond 204 et le
    #    compte, ou 403 : jamais 401, qui reste la réponse du mur et doit garder
    #    sa demande de mot de passe.
    auth_request     /__vigie/controle;
    auth_request_set $vigie_compte $upstream_http_x_vigie_compte;

    # Le refus du mur, en français (cf. l'atelier). SANS `=` : le 401 et son
    # `WWW-Authenticate` partent tels quels.
    error_page 401 /__vigie-401.html;
    # Le refus de session : vers l'atelier, qui rouvre le passage ou dit
    # pourquoi il ne le peut pas (page en français, lien vers l'atelier).
    error_page 403 = @vers_atelier;

    # `return` agit avant le contrôle d'accès ; `auth_request off` le dit, et
    # garde ce renvoi d'un second 403 si quelqu'un y ajoute une directive.
    location @vers_atelier {
        auth_request off;
        return 302 https://atelier.example.org/api/auth/apercu/ouvrir$request_uri;
    }

    # Le juge : une sous-requête, jamais une adresse qu'on demande du dehors.
    location = /__vigie/controle {
        internal;
        proxy_pass http://127.0.0.1:8765/api/auth/apercu/controle;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
        proxy_set_header X-Admin-Key       "";
    }

    # L'entrée : consomme le code et pose le témoin. Sans session par
    # définition, donc hors `auth_request` ; le mur, lui, reste.
    location = /__vigie/entree {
        auth_request off;
        # Le code est dans l'adresse : ne pas l'écrire au journal d'accès.
        access_log off;
        limit_req zone=apercu_entree burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765/api/auth/apercu/entree;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
        proxy_set_header X-Admin-Key       "";
    }

    location = /__vigie-401.html {
        internal;
        auth_basic off;
        auth_request off;
        charset utf-8;
        alias /var/www/vigie-atelier/401.html;
    }

    location / {
        # Chaque requête fait juger la session par l'API (une lecture SQLite) :
        # bornée, large assez pour une page et ses ressources. Si `auth_request`
        # passe avant le mur, c'est aussi ce qui tient un balayeur sans
        # identifiants.
        limit_req zone=apercu burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
        # Le compte, tel que la session le dit — celui qu'un visiteur enverrait
        # est remplacé. Ses cookies (le témoin) s'arrêtent à nginx.
        proxy_set_header X-Vigie-Compte    $vigie_compte;
        proxy_set_header Cookie            "";
    }
}
